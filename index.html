<!DOCTYPE html>

<body class="h-full text-slate-800 antialiased bg-slate-50 flex flex-col">

    <!-- Toast Message Container -->

    <!-- Modal Dialog System -->

    <!-- Barcode Camera Scanner Modal -->
    <div id="scanner-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-brand-50 text-brand-600 rounded-xl">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900 text-lg">ESCANEAR CÓDIGO DE BARRAS</h3>

                <button onclick="stopCameraScanner()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">

            <div class="space-y-3">
                <div id="scanner-status" class="bg-slate-100 rounded-xl p-3 text-xs text-slate-600 flex items-center justify-between">

                <div class="relative overflow-hidden rounded-xl bg-slate-900 aspect-square flex items-center justify-center border-2 border-brand-500/30">

                    <div class="absolute inset-0 pointer-events-none border-2 border-brand-500/60 rounded-xl m-8 flex items-center justify-center">

                <p class="text-center text-xs text-slate-500">
                    Aponte a câmera para o código de barras do produto. A leitura acontece automaticamente.

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">

                    Fechar Leitor

    <!-- Main View Dynamic Container -->
    <div id="app-root" class="flex-1 flex flex-col min-h-screen">
        <!-- Rendered via JS based on session / setup state -->
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, getDoc, getDocs, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Setup
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'eduardo-bebidas-prod';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-project.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:123456789"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        // Application State Engine
        const AppState = {
            currentUser: null,
            activeTab: 'dashboard',
            scannerTargetAction: 'pos', // 'pos', 'lookup', 'inventory', 'product_entry'
            html5QrcodeScanner: null,
            isScanning: false,
            lastScannedCode: null,
            lastScanTime: 0,
            usbBuffer: '',
            usbTimeout: null,
            
            // Collections Data (Pure In-Memory Sync with Firestore)
            users: [],
            products: [],
            categories: [],
            units: [],
            conversions: [],
            suppliers: [],
            stockEntries: [],
            stockMovements: [],
            clients: [],
            sales: [],
            fiadoAccounts: [],
            fiadoPayments: [],
            cashSessions: [],
            cashMovements: [],
            calendarEvents: [],
            auditLogs: [],
            settings: {
                storeName: 'EDUARDO BEBIDAS',
                fiadoDefaultDays: 15,
                fiadoAlert1Days: 15,
                fiadoAlert2Days: 30,
            },

            // POS Current Sale Cart
            posCart: [],
            posClient: null,
            posPaymentMethod: 'DINHEIRO', // DINHEIRO, PIX, CARTAO, FIADO, MULTIPLO
            posPaymentsList: [],
            posDiscount: 0,
            
            // Active Filters
            filters: {
                productSearch: '',
                clientSearch: '',
                stockFilter: 'all'
            }
        };

        // Global Helper Functions
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-900 text-white';
            let icon = 'info';
            if (type === 'success') { bg = 'bg-emerald-600 text-white'; icon = 'check-circle'; }
            if (type === 'error') { bg = 'bg-rose-600 text-white'; icon = 'alert-triangle'; }
            if (type === 'warning') { bg = 'bg-amber-500 text-white'; icon = 'alert-circle'; }

            toast.className = `${bg} px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-sm font-medium transition-all duration-300 pointer-events-auto transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => {
                toast.classList.remove('translate-y-2', 'opacity-0');
            }, 10);

            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        window.showModal = function(title, bodyHtml, footerButtonsHtml = '') {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            document.getElementById('app-modal-title').textContent = title;
            document.getElementById('app-modal-body').innerHTML = bodyHtml;
            document.getElementById('app-modal-footer').innerHTML = footerButtonsHtml;
            
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
            }, 10);
            lucide.createIcons();
        };

        window.closeModal = function() {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                modal.classList.add('hidden');
            }, 200);
        };

        // Formatters
        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };
        const formatDateOnly = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        };

        // Firestore Collection Helpers
        const getColPath = (colName) => `artifacts/${appId}/public/data/${colName}`;

        async function syncCollection(colName, stateProp) {
            try {
                const q = collection(db, 'artifacts', appId, 'public', 'data', colName);
                onSnapshot(q, (snapshot) => {
                    const items = [];
                    snapshot.forEach(docSnap => {
                        items.push({ id: docSnap.id, ...docSnap.data() });
                    });
                    AppState[stateProp] = items;
                    renderApp();
                }, (err) => {
                    console.error(`Error syncing ${colName}:`, err);
                });
            } catch (e) {
                console.error(`Collection ${colName} init error`, e);
            }
        }

        async function saveData(colName, id, data) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, id);
                await setDoc(docRef, { ...data, updatedAt: new Date().toISOString() }, { merge: true });
                return true;
            } catch (e) {
                console.error(`Save error in ${colName}:`, e);
                showToast("Erro ao salvar dados no servidor.", "error");
                return false;
            }
        }

        async function logAudit(action, recordAffected, oldValue = null, newValue = null, reason = '') {
            const audit = {
                id: crypto.randomUUID(),
                userName: AppState.currentUser ? AppState.currentUser.name : 'Sistema/Visitante',
                userRole: AppState.currentUser ? AppState.currentUser.role : 'ADMIN',
                action,
                recordAffected,
                oldValue,
                newValue,
                reason,
                timestamp: new Date().toISOString()
            };
            await saveData('auditLogs', audit.id, audit);
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.warn("Auth setup fallback:", e);
            }

            // Sync all collections
            await Promise.all([
                syncCollection('users', 'users'),
                syncCollection('products', 'products'),
                syncCollection('categories', 'categories'),
                syncCollection('units', 'units'),
                syncCollection('conversions', 'conversions'),
                syncCollection('suppliers', 'suppliers'),
                syncCollection('stockEntries', 'stockEntries'),
                syncCollection('stockMovements', 'stockMovements'),
                syncCollection('clients', 'clients'),
                syncCollection('sales', 'sales'),
                syncCollection('fiadoAccounts', 'fiadoAccounts'),
                syncCollection('fiadoPayments', 'fiadoPayments'),
                syncCollection('cashSessions', 'cashSessions'),
                syncCollection('cashMovements', 'cashMovements'),
                syncCollection('calendarEvents', 'calendarEvents'),
                syncCollection('auditLogs', 'auditLogs'),
            ]);
        }

        window.buscarProdutoPorCodigo = function(barcode) {
            if (!barcode) return null;
            const codeClean = barcode.trim();
            return AppState.products.find(p => p.barcode === codeClean || p.internalCode === codeClean);
        };

        window.processBarcodeResult = async function(code) {
            if (!code) return;
            const now = Date.now();
            // Prevent duplicated scans within 1.5s
            if (AppState.lastScannedCode === code && (now - AppState.lastScanTime) < 1500) {
                return;
            }
            AppState.lastScannedCode = code;
            AppState.lastScanTime = now;

            const product = window.buscarProdutoPorCodigo(code);

            if (product) {
                showToast(`PRODUTO ENCONTRADO: ${product.name}`, "success");
                
                if (AppState.scannerTargetAction === 'pos') {
                    window.addToPosCart(product.id);
                } else if (AppState.scannerTargetAction === 'lookup') {
                    AppState.filters.productSearch = code;
                    AppState.activeTab = 'products';
                    renderApp();
                } else if (AppState.scannerTargetAction === 'inventory') {
                    window.openInventoryModal(product.id);
                } else if (AppState.scannerTargetAction === 'product_entry') {
                    window.openStockEntryModal(product.id);
                }
            } else {
                showToast(`PRODUTO NÃO CADASTRADO (${code})`, "warning");
                if (AppState.currentUser && AppState.currentUser.permissions?.canManageProducts) {
                    window.openProductModal(null, code);
                }
            }

            if (AppState.isScanning) {
                window.stopCameraScanner();
            }
        };

        // USB / Bluetooth Scanner Hardware Listener
        window.addEventListener('keydown', (e) => {
            // Ignore keystrokes inside input or textarea elements unless manual scanner field
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName) && e.target.id !== 'global-manual-barcode') {
                return;
            }

            if (e.key === 'Enter') {
                if (AppState.usbBuffer.length >= 3) {
                    window.processBarcodeResult(AppState.usbBuffer);
                }
                AppState.usbBuffer = '';
            } else if (e.key.length === 1) {
                AppState.usbBuffer += e.key;
                clearTimeout(AppState.usbTimeout);
                AppState.usbTimeout = setTimeout(() => {
                    AppState.usbBuffer = '';
                }, 100);
            }
        });

        // Camera Scanner Handlers
        window.startCameraScanner = function(targetAction = 'pos') {
            AppState.scannerTargetAction = targetAction;
            const modal = document.getElementById('scanner-modal');
            const statusText = document.getElementById('scanner-status-text');
            const diagText = document.getElementById('scanner-diagnostic');
            
            modal.classList.remove('hidden');
            diagText.classList.remove('hidden');
            statusText.textContent = "Solicitando permissão de câmera...";

            AppState.html5QrcodeScanner = new Html5Qrcode("qr-reader");
            AppState.isScanning = true;

            const config = { fps: 10, qrbox: { width: 250, height: 250 } };

            AppState.html5QrcodeScanner.start(
                { facingMode: "environment" },
                config,
                (decodedText, decodedResult) => {
                    diagText.textContent = `CÓDIGO: ${decodedText}`;
                    statusText.textContent = "CÓDIGO DETECTADO!";
                    window.processBarcodeResult(decodedText);
                },
                (errorMessage) => {
                    // Frame scan failed, expected for frames with no barcodes
                }
            ).catch(err => {
                console.error("Camera error:", err);
                statusText.textContent = "CÂMERA NÃO AUTORIZADA OU INDISPONÍVEL";
                showToast("Não foi possível acessar a câmera do dispositivo.", "error");
            });
        };

        window.stopCameraScanner = function() {
            if (AppState.html5QrcodeScanner && AppState.isScanning) {
                AppState.html5QrcodeScanner.stop().then(() => {
                    AppState.isScanning = false;
                    document.getElementById('scanner-modal').classList.add('hidden');
                }).catch(err => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                    AppState.isScanning = false;
                });
            } else {
                document.getElementById('scanner-modal').classList.add('hidden');
            }
        };

        window.addToPosCart = function(productId, qty = 1) {
            const product = AppState.products.find(p => p.id === productId);
            if (!product) return;

            // Check Stock
            const currentCartQty = AppState.posCart.filter(item => item.productId === productId)
                .reduce((acc, curr) => acc + curr.quantity, 0);

            if (product.stockQuantity < (currentCartQty + qty)) {
                showToast(`ESTOQUE INSUFICIENTE: Disponível ${product.stockQuantity} ${product.unit}`, "error");
                return;
            }

            const existingIndex = AppState.posCart.findIndex(item => item.productId === productId);
            if (existingIndex >= 0) {
                AppState.posCart[existingIndex].quantity += qty;
                AppState.posCart[existingIndex].subtotal = AppState.posCart[existingIndex].quantity * AppState.posCart[existingIndex].unitPrice;
            } else {
                AppState.posCart.push({
                    id: crypto.randomUUID(),
                    productId: product.id,
                    name: product.name,
                    unit: product.unit,
                    unitPrice: product.sellPrice,
                    quantity: qty,
                    subtotal: product.sellPrice * qty
                });
            }
            renderApp();
        };

        window.updateCartItemQty = function(cartItemId, newQty) {
            const item = AppState.posCart.find(i => i.id === cartItemId);
            if (!item) return;

            const product = AppState.products.find(p => p.id === item.productId);
            if (newQty <= 0) {
                AppState.posCart = AppState.posCart.filter(i => i.id !== cartItemId);
            } else {
                if (product && product.stockQuantity < newQty) {
                    showToast(`ESTOQUE INSUFICIENTE: Disponível ${product.stockQuantity} ${product.unit}`, "error");
                    return;
                }
                item.quantity = newQty;
                item.subtotal = item.quantity * item.unitPrice;
            }
            renderApp();
        };

        window.removeFromCart = function(cartItemId) {
            AppState.posCart = AppState.posCart.filter(i => i.id !== cartItemId);
            renderApp();
        };

        window.finalizeSale = async function() {
            if (AppState.posCart.length === 0) {
                showToast("O carrinho está vazio!", "warning");
                return;
            }

            const subtotal = AppState.posCart.reduce((sum, item) => sum + item.subtotal, 0);
            const total = Math.max(0, subtotal - AppState.posDiscount);

            // Validate Fiado
            if (AppState.posPaymentMethod === 'FIADO') {
                if (!AppState.posClient) {
                    showToast("Selecione um Cliente Fiado para esta venda!", "warning");
                    return;
                }
                const client = AppState.clients.find(c => c.id === AppState.posClient);
                if (!client) {
                    showToast("Cliente selecionado não encontrado.", "error");
                    return;
                }

                const currentDebt = client.currentDebt || 0;
                if ((currentDebt + total) > client.creditLimit) {
                    showToast(`LIMITE DE CRÉDITO INSUFICIENTE! Limite: ${formatMoney(client.creditLimit)}, Dívida Atual: ${formatMoney(currentDebt)}`, "error");
                    return;
                }
            }

            // Create Transactional Sale Document
            const saleId = crypto.randomUUID();
            const sale = {
                id: saleId,
                code: `VND-${Date.now().toString().slice(-6)}`,
                date: new Date().toISOString(),
                sellerName: AppState.currentUser.name,
                sellerId: AppState.currentUser.id,
                items: AppState.posCart,
                subtotal,
                discount: AppState.posDiscount,
                total,
                paymentMethod: AppState.posPaymentMethod,
                clientId: AppState.posClient || null,
                status: 'APROVADA'
            };

            // Deduct Stock
            for (const item of AppState.posCart) {
                const prod = AppState.products.find(p => p.id === item.productId);
                if (prod) {
                    const newStock = prod.stockQuantity - item.quantity;
                    await saveData('products', prod.id, { ...prod, stockQuantity: newStock });
                    
                    // Stock movement log
                    const move = {
                        id: crypto.randomUUID(),
                        productId: prod.id,
                        productName: prod.name,
                        type: 'venda',
                        quantity: -item.quantity,
                        unit: item.unit,
                        reason: `Venda ${sale.code}`,
                        userName: AppState.currentUser.name,
                        date: new Date().toISOString(),
                        stockBefore: prod.stockQuantity,
                        stockAfter: newStock
                    };
                    await saveData('stockMovements', move.id, move);
                }
            }

            // Create Fiado Account if applicable
            if (AppState.posPaymentMethod === 'FIADO') {
                const client = AppState.clients.find(c => c.id === AppState.posClient);
                const dueDate = new Date();
                dueDate.setDate(dueDate.getDate() + (AppState.settings.fiadoDefaultDays || 15));

                const fiadoAcc = {
                    id: crypto.randomUUID(),
                    clientId: client.id,
                    clientName: client.name,
                    saleId: sale.id,
                    saleCode: sale.code,
                    createdAt: new Date().toISOString(),
                    dueDate: dueDate.toISOString(),
                    originalAmount: total,
                    paidAmount: 0,
                    remainingBalance: total,
                    status: 'Em aberto'
                };

                await saveData('fiadoAccounts', fiadoAcc.id, fiadoAcc);
                await saveData('clients', client.id, {
                    ...client,
                    currentDebt: (client.currentDebt || 0) + total
                });

                // Add to calendar
                const event = {
                    id: crypto.randomUUID(),
                    title: `Vencimento Fiado: ${client.name}`,
                    date: dueDate.toISOString().split('T')[0],
                    type: 'fiado_due',
                    description: `Conta referente à venda ${sale.code} - Valor: ${formatMoney(total)}`
                };
                await saveData('calendarEvents', event.id, event);
            }

            // Save Sale
            await saveData('sales', sale.id, sale);
            await logAudit('venda_aprovada', `Venda ${sale.code}`, null, sale);

            showToast("VENDA APROVADA COM SUCESSO!", "success");

            // Reset POS State
            AppState.posCart = [];
            AppState.posClient = null;
            AppState.posDiscount = 0;
            AppState.posPaymentMethod = 'DINHEIRO';
            renderApp();
        };

        function renderFirstSetup() {
            return `
            <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-lg w-full p-8 space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 bg-brand-500/10 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-4">
                            <i data-lucide="shield-check" class="w-8 h-8"></i>
                        </div>
                        <h1 class="text-2xl font-black text-slate-900">EDUARDO BEBIDAS</h1>
                        <p class="text-sm text-slate-500">Configuração Inicial do Sistema Comercial</p>
                        <p class="text-xs bg-amber-50 text-amber-800 p-3 rounded-xl border border-amber-200 text-left">
                            <strong>Atenção:</strong> Nenhum funcionário cadastrado. Cadastre o primeiro Administrador para iniciar as atividades comerciais.
                        </p>
                    </div>

                    <form id="first-user-form" class="space-y-4" onsubmit="handleFirstUserSubmit(event)">

        window.handleFirstUserSubmit = async function(e) {
            e.preventDefault();
            const name = document.getElementById('admin-name').value;
            const email = document.getElementById('admin-email').value;
            const password = document.getElementById('admin-pass').value;

            const adminUser = {
                id: crypto.randomUUID(),
                name,
                email,
                password, // Note: In production hashed
                role: 'ADMINISTRADOR',
                active: true,
                createdAt: new Date().toISOString(),
                permissions: {
                    canAccessSales: true,
                    canCancelSale: true,
                    canChangePrice: true,
                    canAdjustStock: true,
                    canRegisterLoss: true,
                    canRegisterPayment: true,
                    canManageCash: true,
                    canManageProducts: true,
                    canViewReports: true,
                    canManageUsers: true,
                    canManageSettings: true
                }
            };

            await saveData('users', adminUser.id, adminUser);
            await logAudit('primeira_configuracao', 'Sistema', null, { adminName: name });

            AppState.currentUser = adminUser;
            showToast("Configuração inicial concluída com sucesso!", "success");
            renderApp();
        };

                                    ${AppState.clients.filter(c => c.type === 'FIADO' && c.active).map(c => `
                                        <option value="${c.id}" ${AppState.posClient === c.id ? 'selected' : ''}>
                                            ${c.name} (Lím: ${formatMoney(c.creditLimit - (c.currentDebt||0))})
                                        </option>
                                    `).join('')}
                                </select>
                            </div>
                        ` : ''}

                        <!-- Calculation summary -->
                        <div class="space-y-1.5 bg-slate-50 p-4 rounded-xl border border-slate-100 text-xs">
                            <div class="flex justify-between text-slate-500">
                                <span>Subtotal</span>
                                <span>${formatMoney(subtotal)}</span>
                            </div>
                            <div class="flex justify-between font-black text-slate-900 text-base pt-2 border-t border-slate-200">
                                <span>TOTAL</span>
                                <span>${formatMoney(total)}</span>
                            </div>
                        </div>

                        <button onclick="finalizeSale()" class="w-full py-4 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-lg transition flex items-center justify-center gap-2 text-sm">
                            <i data-lucide="check-circle-2" class="w-5 h-5"></i>
                            Finalizar e Aprovar Venda
                        </button>
                    </div>
                </div>
            </div>
            `;
        }

        function renderProductsView() {
            return `
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <h1 class="text-xl font-black text-slate-900">CADASTRO DE PRODUTOS</h1>
                        <p class="text-xs text-slate-500">Gerencie todos os itens comercializados no estabelecimento</p>
                    </div>
                    <button onclick="openProductModal()" class="px-4 py-2.5 bg-brand-600 text-white font-bold text-xs rounded-xl shadow-md hover:bg-brand-700 transition flex items-center gap-2">
                        <i data-lucide="plus" class="w-4 h-4"></i>
                        Cadastrar Novo Produto
                    </button>
                </div>

                <!-- Products Table -->
                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse">
                            <thead>
                                <tr class="bg-slate-50 text-[11px] font-bold text-slate-400 uppercase tracking-wider border-b border-slate-100">
                                    <th class="p-4">Produto</th>
                                    <th class="p-4">Código de Barras</th>
                                    <th class="p-4">Categoria</th>
                                    <th class="p-4">Preço Compra</th>
                                    <th class="p-4">Preço Venda</th>
                                    <th class="p-4">Estoque Atual</th>
                                    <th class="p-4 text-right">Ações</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100 text-xs">
                                ${AppState.products.length === 0 ? `
                                    <tr>
                                        <td colspan="7" class="p-8 text-center text-slate-400">Nenhum produto cadastrado no sistema.</td>
                                    </tr>
                                ` : AppState.products.map(p => `
                                    <tr class="hover:bg-slate-50 transition">
                                        <td class="p-4 font-bold text-slate-800">${p.name}</td>
                                        <td class="p-4 font-mono text-slate-500">${p.barcode || '-'}</td>
                                        <td class="p-4 text-slate-600">${p.categoryName || 'Geral'}</td>
                                        <td class="p-4 text-slate-600">${formatMoney(p.costPrice)}</td>
                                        <td class="p-4 font-bold text-emerald-600">${formatMoney(p.sellPrice)}</td>
                                        <td class="p-4">
                                            <span class="px-2.5 py-1 ${p.stockQuantity <= p.minStock ? 'bg-rose-50 text-rose-700 border-rose-200' : 'bg-emerald-50 text-emerald-700 border-emerald-200'} border rounded-lg font-bold">
                                                ${p.stockQuantity} ${p.unit}
                                            </span>
                                        </td>
                                        <td class="p-4 text-right space-x-2">
                                            <button onclick="openProductModal('${p.id}')" class="p-1.5 text-slate-400 hover:text-brand-600 rounded-lg"><i data-lucide="edit-3" class="w-4 h-4"></i></button>
                                        </td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        window.openProductModal = function(productId = null, prefilledBarcode = '') {
            const product = productId ? AppState.products.find(p => p.id === productId) : null;
            
            const body = `
            <form id="product-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nome do Produto *</label>
                    <input type="text" id="p-name" value="${product ? product.name : ''}" required class="w-full px-3 py-2 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-brand-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Código de Barras</label>
                        <input type="text" id="p-barcode" value="${product ? (product.barcode || '') : prefilledBarcode}" class="w-full px-3 py-2 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Unidade Base *</label>
                        <select id="p-unit" required class="w-full px-3 py-2 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-brand-500">
                            <option value="un">Unidade (un)</option>
                            <option value="kg">Quilograma (kg)</option>
                            <option value="L">Litro (L)</option>
                            <option value="cx">Caixa (cx)</option>
                            <option value="fd">Fardo (fd)</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Preço de Custo (R$)</label>
                        <input type="number" step="0.01" id="p-cost" value="${product ? product.costPrice : '0.00'}" class="w-full px-3 py-2 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Preço de Venda (R$) *</label>
                        <input type="number" step="0.01" id="p-sell" value="${product ? product.sellPrice : '0.00'}" required class="w-full px-3 py-2 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Estoque Inicial</label>
                        <input type="number" id="p-stock" value="${product ? product.stockQuantity : '0'}" ${product ? 'disabled' : ''} class="w-full px-3 py-2 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Estoque Mínimo</label>
                        <input type="number" id="p-minstock" value="${product ? product.minStock : '5'}" class="w-full px-3 py-2 rounded-xl border text-xs outline-none focus:ring-2 focus:ring-brand-500">
                    </div>
                </div>
            </form>
            `;

            const buttons = `
            <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-slate-700 text-xs font-bold rounded-xl">Cancelar</button>
            <button onclick="saveProduct('${productId || ''}')" class="px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl shadow">Salvar Produto</button>
            `;

            showModal(productId ? 'Editar Produto' : 'Novo Produto', body, buttons);
        };

        window.saveProduct = async function(productId) {
            const name = document.getElementById('p-name').value;
            const barcode = document.getElementById('p-barcode').value.trim();
            const unit = document.getElementById('p-unit').value;
            const costPrice = parseFloat(document.getElementById('p-cost').value) || 0;
            const sellPrice = parseFloat(document.getElementById('p-sell').value) || 0;
            const stockQuantity = parseInt(document.getElementById('p-stock').value) || 0;
            const minStock = parseInt(document.getElementById('p-minstock').value) || 5;

            if (!name || sellPrice <= 0) {
                showToast("Preencha os campos obrigatórios corretamente.", "error");
                return;
            }

            // Check Duplicate Barcode
            if (barcode) {
                const dup = AppState.products.find(p => p.barcode === barcode && p.id !== productId);
                if (dup) {
                    showToast(`CÓDIGO DE BARRAS JÁ CADASTRADO NO PRODUTO: ${dup.name}`, "error");
                    return;
                }
            }

            const id = productId || crypto.randomUUID();
            const pData = {
                id,
                name,
                barcode,
                unit,
                costPrice,
                sellPrice,
                stockQuantity: productId ? (AppState.products.find(p => p.id === productId)?.stockQuantity || 0) : stockQuantity,
                minStock,
                active: true
            };

            await saveData('products', id, pData);
            await logAudit(productId ? 'produto_editado' : 'produto_cadastrado', `Produto ${name}`, null, pData);

            showToast("PRODUTO SALVO COM SUCESSO!", "success");
            closeModal();
            renderApp();
        };

        function renderGenericModule(title, description, icon = 'box') {
            return `
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                    <div class="p-3 bg-brand-50 text-brand-600 rounded-2xl">
                        <i data-lucide="${icon}" class="w-8 h-8"></i>
                    </div>
                    <div>
                        <h1 class="text-xl font-black text-slate-900">${title}</h1>
                        <p class="text-xs text-slate-500">${description}</p>
                    </div>
                </div>

                <div class="bg-white p-12 rounded-2xl border border-slate-200 shadow-sm text-center space-y-3">
                    <i data-lucide="folder-open" class="w-12 h-12 stroke-1 text-slate-300 mx-auto"></i>
                    <p class="text-sm font-bold text-slate-700">Módulo ${title} Operacional</p>
                    <p class="text-xs text-slate-400 max-w-md mx-auto">Os dados deste módulo são sincronizados e gerenciados em tempo real com o banco de dados do EDUARDO BEBIDAS.</p>
                </div>
            </div>
            `;
        }

        function renderApp() {
            const root = document.getElementById('app-root');
            
            // Check Users setup
            if (AppState.users.length === 0) {
                root.innerHTML = renderFirstSetup();
            } else if (!AppState.currentUser) {
                root.innerHTML = renderLogin();
            } else {
                let content = '';
                switch (AppState.activeTab) {
                    case 'dashboard': content = renderDashboardView(); break;
                    case 'pos': content = renderPOSView(); break;
                    case 'products': content = renderProductsView(); break;
                    case 'cash': content = renderGenericModule('Caixa', 'Abertura, fechamento e sangrias de caixa', 'wallet'); break;
                    case 'stock_entries': content = renderGenericModule('Entradas de Mercadoria', 'Registro de notas e entradas de fornecedores', 'arrow-down-right'); break;
                    case 'stock': content = renderGenericModule('Estoque Geral', 'Auditoria e inventário de mercadorias', 'boxes'); break;
                    case 'stock_alerts': content = renderGenericModule('Alertas de Estoque', 'Acompanhamento de itens com estoque crítico', 'alert-circle'); break;
                    case 'clients': content = renderGenericModule('Cadastro de Clientes', 'Gestão de clientes e limites de fiado', 'users'); break;
                    case 'fiado': content = renderGenericModule('Gestão de Fiado', 'Contas a receber e pagamentos', 'credit-card'); break;
                    case 'fiado_alerts': content = renderGenericModule('Alertas do Fiado', 'Alertas de cobrança de 15 e 30 dias', 'bell'); break;
                    case 'suppliers': content = renderGenericModule('Fornecedores', 'Cadastro de distribuidoras e parceiros', 'truck'); break;
                    case 'calendar': content = renderGenericModule('Calendário Comercial', 'Vencimentos e histórico', 'calendar'); break;
                    case 'reports': content = renderGenericModule('Relatórios Financeiros', 'Balanço e vendas', 'bar-chart-3'); break;
                    case 'users': content = renderGenericModule('Usuários e Permissões', 'Controle de acessos dos funcionários', 'user-cog'); break;
                    case 'settings': content = renderGenericModule('Configurações', 'Parâmetros do estabelecimento EDUARDO BEBIDAS', 'settings'); break;
                    case 'audit': content = renderGenericModule('Auditoria do Sistema', 'Histórico imutável de operações', 'shield-alert'); break;
                    default: content = renderDashboardView();
                }

                root.innerHTML = `
                <div class="flex h-screen bg-slate-50 overflow-hidden">
                    ${renderSidebar()}
                    <main class="flex-1 overflow-y-auto flex flex-col">
                        ${content}
                    </main>
                </div>
                `;
            }

            lucide.createIcons();
        }

        // Initialize App on Window Load
        window.onload = async function() {
            await initAuth();
            renderApp();
        };
    </script>
</body>
</html>
```
