<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="preconnect" href="https://fonts.googleapis.com">

</head>
<body class="h-full text-slate-800 antialiased bg-slate-50 flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Universal Modal Dialog System -->
    <div id="app-modal" class="fixed inset-0 z-40 hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div id="app-modal-content" class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-xl w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 max-h-[90vh] overflow-y-auto">
            <div class="flex items-start justify-between border-b pb-3 border-slate-100">
                <h3 id="app-modal-title" class="text-lg font-bold text-slate-900"></h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 rounded-lg p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="app-modal-body" class="text-slate-600 text-sm leading-relaxed space-y-3"></div>
            <div id="app-modal-footer" class="flex justify-end gap-3 pt-3 border-t border-slate-100"></div>
        </div>
    </div>

    <!-- Barcode Camera Scanner Modal -->
    <div id="scanner-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-brand-50 text-brand-600 rounded-xl">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900 text-base">LEITOR CÂMERA EM TEMPO REAL</h3>
                        <p class="text-xs text-slate-500">Aponte para o código do produto</p>
                    </div>
                </div>
                <button onclick="stopCameraScanner()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div id="scanner-status" class="bg-slate-100 rounded-xl p-3 text-xs text-slate-600 flex items-center justify-between">
                    <span id="scanner-status-text">Iniciando câmera...</span>
                    <span id="scanner-diagnostic" class="font-mono bg-white px-2 py-0.5 rounded border text-[11px] text-slate-700 hidden">CÓDIGO: -</span>
                </div>

                <div class="relative overflow-hidden rounded-xl bg-slate-900 aspect-square flex items-center justify-center border-2 border-brand-500/30">
                    <div id="qr-reader" class="w-full h-full"></div>
                    <div class="absolute inset-0 pointer-events-none border-2 border-brand-500/60 rounded-xl m-8 flex items-center justify-center">
                        <div class="w-full h-0.5 bg-red-500/80 animate-pulse"></div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button onclick="stopCameraScanner()" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs font-bold rounded-xl transition">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- Main View Root Container -->
    <div id="app-root" class="flex-1 flex flex-col min-h-screen"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Firebase Configuration
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'eduardo-bebidas-prod';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-project.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:123456789"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        // Global State Management
        const AppState = {
            currentUser: null,
            activeTab: 'dashboard',
            scannerTargetAction: 'pos',
            html5QrcodeScanner: null,
            isScanning: false,
            lastScannedCode: null,
            lastScanTime: 0,
            usbBuffer: '',
            usbTimeout: null,
            
            // Collections
            users: [],
            products: [],
            categories: [],
            suppliers: [],
            stockEntries: [],
            stockMovements: [],
            clients: [],
            sales: [],
            fiadoAccounts: [],
            fiadoPayments: [],
            cashSessions: [],
            cashMovements: [],
            calendarEvents: [],
            auditLogs: [],
            settings: {
                storeName: 'EDUARDO BEBIDAS',
                phone: '(00) 00000-0000',
                address: 'Rua Principal, Centro',
                fiadoDefaultDays: 15,
                fiadoAlert1Days: 15,
                fiadoAlert2Days: 30,
                whatsappMessageTemplate: 'Olá {cliente}, você possui um débito no valor de {valor} vencido em {vencimento} na EDUARDO BEBIDAS. Podemos agendar o pagamento?'
            },

            // POS Current Sale State
            posCart: [],
            posClient: null,
            posPaymentMethod: 'DINHEIRO',
            posDiscount: 0,
            
            // Filters
            filters: {
                productSearch: '',
                clientSearch: '',
                reportRange: '30'
            }
        };

        // Utility Toast & Modal Functions
        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-900 text-white';
            let icon = 'info';
            if (type === 'success') { bg = 'bg-emerald-600 text-white'; icon = 'check-circle'; }
            if (type === 'error') { bg = 'bg-rose-600 text-white'; icon = 'alert-triangle'; }
            if (type === 'warning') { bg = 'bg-amber-500 text-white'; icon = 'alert-circle'; }

            toast.className = `${bg} px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-xs font-bold transition-all duration-300 pointer-events-auto transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        window.showModal = function(title, bodyHtml, footerButtonsHtml = '') {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            document.getElementById('app-modal-title').textContent = title;
            document.getElementById('app-modal-body').innerHTML = bodyHtml;
            document.getElementById('app-modal-footer').innerHTML = footerButtonsHtml;
            
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
            lucide.createIcons();
        };

        window.closeModal = function() {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        };

        // Formatters
        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };
        const formatDateOnly = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        };

        // Firestore Realtime Synchronization
        async function syncCollection(colName, stateProp) {
            try {
                const q = collection(db, 'artifacts', appId, 'public', 'data', colName);
                onSnapshot(q, (snapshot) => {
                    const items = [];
                    snapshot.forEach(docSnap => items.push({ id: docSnap.id, ...docSnap.data() }));
                    AppState[stateProp] = items;
                    renderApp();
                });
            } catch (e) {
                console.error(`Error syncing ${colName}`, e);
            }
        }

        async function saveData(colName, id, data) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, id);
                await setDoc(docRef, { ...data, updatedAt: new Date().toISOString() }, { merge: true });
                return true;
            } catch (e) {
                console.error(`Save error ${colName}:`, e);
                showToast("Erro ao salvar dados no servidor.", "error");
                return false;
            }
        }

        async function deleteData(colName, id) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, id);
                await deleteDoc(docRef);
                return true;
            } catch (e) {
                console.error(`Delete error ${colName}:`, e);
                showToast("Erro ao excluir do servidor.", "error");
                return false;
            }
        }

        async function logAudit(action, recordAffected, oldValue = null, newValue = null, reason = '') {
            const audit = {
                id: crypto.randomUUID(),
                userName: AppState.currentUser ? AppState.currentUser.name : 'Sistema/Visitante',
                userRole: AppState.currentUser ? AppState.currentUser.role : 'ADMINISTRADOR',
                action,
                recordAffected,
                oldValue,
                newValue,
                reason,
                timestamp: new Date().toISOString()
            };
            await saveData('auditLogs', audit.id, audit);
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.warn("Auth fallback:", e);
            }

            await Promise.all([
                syncCollection('users', 'users'),
                syncCollection('products', 'products'),
                syncCollection('categories', 'categories'),
                syncCollection('suppliers', 'suppliers'),
                syncCollection('stockEntries', 'stockEntries'),
                syncCollection('stockMovements', 'stockMovements'),
                syncCollection('clients', 'clients'),
                syncCollection('sales', 'sales'),
                syncCollection('fiadoAccounts', 'fiadoAccounts'),
                syncCollection('fiadoPayments', 'fiadoPayments'),
                syncCollection('cashSessions', 'cashSessions'),
                syncCollection('cashMovements', 'cashMovements'),
                syncCollection('calendarEvents', 'calendarEvents'),
                syncCollection('auditLogs', 'auditLogs'),
            ]);
        }

        // Camera & Barcode Hardware Readers
        window.startCameraScanner = function(targetAction = 'pos') {
            AppState.scannerTargetAction = targetAction;
            const modal = document.getElementById('scanner-modal');
            const statusText = document.getElementById('scanner-status-text');
            const diagText = document.getElementById('scanner-diagnostic');
            
            modal.classList.remove('hidden');
            diagText.classList.remove('hidden');
            statusText.textContent = "Acessando câmera...";

            AppState.html5QrcodeScanner = new Html5Qrcode("qr-reader");
            AppState.isScanning = true;

            AppState.html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    diagText.textContent = `CÓDIGO: ${decodedText}`;
                    statusText.textContent = "LIDO!";
                    window.processBarcodeResult(decodedText);
                },
                () => {}
            ).catch(err => {
                statusText.textContent = "CÂMERA NÃO PERMITIDA";
                showToast("Não foi possível acessar a câmera.", "error");
            });
        };

        window.stopCameraScanner = function() {
            if (AppState.html5QrcodeScanner && AppState.isScanning) {
                AppState.html5QrcodeScanner.stop().then(() => {
                    AppState.isScanning = false;
                    document.getElementById('scanner-modal').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                    AppState.isScanning = false;
                });
            } else {
                document.getElementById('scanner-modal').classList.add('hidden');
            }
        };

        window.processBarcodeResult = function(code) {
            if (!code) return;
            const now = Date.now();
            if (AppState.lastScannedCode === code && (now - AppState.lastScanTime) < 1500) return;
            AppState.lastScannedCode = code;
            AppState.lastScanTime = now;

            const codeClean = code.trim();
            const product = AppState.products.find(p => p.barcode === codeClean);

            if (product) {
                showToast(`PRODUTO: ${product.name}`, "success");
                if (AppState.scannerTargetAction === 'pos') {
                    window.addToPosCart(product.id);
                } else if (AppState.scannerTargetAction === 'stock_entry') {
                    window.openStockEntryModal(product.id);
                }
            } else {
                showToast(`CÓDIGO NÃO CADASTRADO (${code})`, "warning");
                if (AppState.currentUser?.permissions?.canManageProducts) {
                    window.openProductModal(null, codeClean);
                }
            }
            if (AppState.isScanning) window.stopCameraScanner();
        };

        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
            if (e.key === 'Enter') {
                if (AppState.usbBuffer.length >= 3) window.processBarcodeResult(AppState.usbBuffer);
                AppState.usbBuffer = '';
            } else if (e.key.length === 1) {
                AppState.usbBuffer += e.key;
                clearTimeout(AppState.usbTimeout);
                AppState.usbTimeout = setTimeout(() => AppState.usbBuffer = '', 100);
            }
        });

        // POS Cart Functions
        window.addToPosCart = function(productId, qty = 1) {
            const product = AppState.products.find(p => p.id === productId);
            if (!product) return;

            const inCartQty = AppState.posCart.filter(i => i.productId === productId).reduce((acc, i) => acc + i.quantity, 0);
            if (product.stockQuantity < (inCartQty + qty)) {
                showToast(`ESTOQUE INSUFICIENTE: Disponível ${product.stockQuantity} ${product.unit}`, "error");
                return;
            }

            const existingIndex = AppState.posCart.findIndex(i => i.productId === productId);
            if (existingIndex >= 0) {
                AppState.posCart[existingIndex].quantity += qty;
                AppState.posCart[existingIndex].subtotal = AppState.posCart[existingIndex].quantity * AppState.posCart[existingIndex].unitPrice;
            } else {
                AppState.posCart.push({
                    id: crypto.randomUUID(),
                    productId: product.id,
                    name: product.name,
                    unit: product.unit,
                    unitPrice: product.sellPrice,
                    quantity: qty,
                    subtotal: product.sellPrice * qty
                });
            }
            renderApp();
        };

        window.updateCartItemQty = function(cartItemId, newQty) {
            const item = AppState.posCart.find(i => i.id === cartItemId);
            if (!item) return;
            const product = AppState.products.find(p => p.id === item.productId);

            if (newQty <= 0) {
                AppState.posCart = AppState.posCart.filter(i => i.id !== cartItemId);
            } else {
                if (product && product.stockQuantity < newQty) {
                    showToast(`ESTOQUE INSUFICIENTE: Disponível ${product.stockQuantity} ${product.unit}`, "error");
                    return;
                }
                item.quantity = newQty;
                item.subtotal = item.quantity * item.unitPrice;
            }
            renderApp();
        };

        window.removeFromCart = function(cartItemId) {
            AppState.posCart = AppState.posCart.filter(i => i.id !== cartItemId);
            renderApp();
        };

        window.finalizeSale = async function() {
            if (AppState.posCart.length === 0) {
                showToast("O carrinho está vazio!", "warning");
                return;
            }

            // Verify Cash Session Open
            const openSession = AppState.cashSessions.find(s => s.status === 'ABERTO');
            if (!openSession) {
                showToast("ABRA O CAIXA antes de finalizar vendas!", "error");
                window.switchTab('cash');
                return;
            }

            const subtotal = AppState.posCart.reduce((sum, item) => sum + item.subtotal, 0);
            const total = Math.max(0, subtotal - AppState.posDiscount);

            if (AppState.posPaymentMethod === 'FIADO') {
                if (!AppState.posClient) {
                    showToast("Selecione um Cliente Fiado!", "warning");
                    return;
                }
                const client = AppState.clients.find(c => c.id === AppState.posClient);
                if (!client) {
                    showToast("Cliente não encontrado.", "error");
                    return;
                }
                const currentDebt = client.currentDebt || 0;
                if ((currentDebt + total) > (client.creditLimit || 0)) {
                    showToast(`LIMITE INSUFICIENTE! Crédito Restante: ${formatMoney((client.creditLimit||0) - currentDebt)}`, "error");
                    return;
                }
            }

            const saleId = crypto.randomUUID();
            const sale = {
                id: saleId,
                code: `VND-${Date.now().toString().slice(-6)}`,
                date: new Date().toISOString(),
                sellerName: AppState.currentUser.name,
                sellerId: AppState.currentUser.id,
                cashSessionId: openSession.id,
                items: AppState.posCart,
                subtotal,
                discount: AppState.posDiscount,
                total,
                paymentMethod: AppState.posPaymentMethod,
                clientId: AppState.posClient || null,
                status: 'APROVADA'
            };

            // Deduct Stock
            for (const item of AppState.posCart) {
                const prod = AppState.products.find(p => p.id === item.productId);
                if (prod) {
                    const newStock = prod.stockQuantity - item.quantity;
                    await saveData('products', prod.id, { ...prod, stockQuantity: newStock });
                    
                    const move = {
                        id: crypto.randomUUID(),
                        productId: prod.id,
                        productName: prod.name,
                        type: 'venda',
                        quantity: -item.quantity,
                        unit: item.unit,
                        reason: `Venda ${sale.code}`,
                        userName: AppState.currentUser.name,
                        date: new Date().toISOString(),
                        stockBefore: prod.stockQuantity,
                        stockAfter: newStock
                    };
                    await saveData('stockMovements', move.id, move);
                }
            }

            // Register Fiado
            if (AppState.posPaymentMethod === 'FIADO') {
                const client = AppState.clients.find(c => c.id === AppState.posClient);
                const dueDate = new Date();
                dueDate.setDate(dueDate.getDate() + (AppState.settings.fiadoDefaultDays || 15));

                const fiadoAcc = {
                    id: crypto.randomUUID(),
                    clientId: client.id,
                    clientName: client.name,
                    saleId: sale.id,
                    saleCode: sale.code,
                    createdAt: new Date().toISOString(),
                    dueDate: dueDate.toISOString(),
                    originalAmount: total,
                    paidAmount: 0,
                    remainingBalance: total,
                    status: 'Em aberto'
                };

                await saveData('fiadoAccounts', fiadoAcc.id, fiadoAcc);
                await saveData('clients', client.id, {
                    ...client,
                    currentDebt: (client.currentDebt || 0) + total
                });

                const event = {
                    id: crypto.randomUUID(),
                    title: `Vencimento Fiado: ${client.name}`,
                    date: dueDate.toISOString().split('T')[0],
                    type: 'fiado_due',
                    description: `Conta referente à venda ${sale.code} - Valor: ${formatMoney(total)}`
                };
                await saveData('calendarEvents', event.id, event);
            }

            // Register in Cash Movement if cash
            if (AppState.posPaymentMethod === 'DINHEIRO') {
                const cashMov = {
                    id: crypto.randomUUID(),
                    cashSessionId: openSession.id,
                    type: 'ENTRADA',
                    category: 'VENDA',
                    amount: total,
                    description: `Venda ${sale.code}`,
                    userName: AppState.currentUser.name,
                    date: new Date().toISOString()
                };
                await saveData('cashMovements', cashMov.id, cashMov);
            }

            await saveData('sales', sale.id, sale);
            await logAudit('venda_aprovada', `Venda ${sale.code}`, null, sale);

            showToast("VENDA FINALIZADA COM SUCESSO!", "success");

            AppState.posCart = [];
            AppState.posClient = null;
            AppState.posDiscount = 0;
            AppState.posPaymentMethod = 'DINHEIRO';
            renderApp();
        };

        // --- AUTH & SETUP VIEWS ---
        function renderFirstSetup() {
            return `
            <div class="min-h-screen bg-slate-900 flex items-center justify-center p-4">
                <div class="bg-white rounded-3xl shadow-2xl border border-slate-100 max-w-lg w-full p-8 space-y-6">
                    <div class="text-center space-y-2">
                        <div class="w-16 h-16 bg-brand-500/10 text-brand-600 rounded-2xl flex items-center justify-center mx-auto mb-2">
                            <i data-lucide="shield-check" class="w-8 h-8"></i>
                        </div>
                        <h1 class="text-2xl font-black text-slate-900">EDUARDO BEBIDAS</h1>
                        <p class="text-xs text-slate-500 font-semibold uppercase tracking-wider">Primeira Configuração do Sistema</p>
                    </div>

                    <div class="bg-amber-50 border border-amber-200 text-amber-800 text-xs p-4 rounded-xl space-y-1">
                        <p class="font-bold flex items-center gap-1.5"><i data-lucide="lock" class="w-4 h-4"></i> Segurança do Sistema</p>
                        <p>Nenhum usuário foi cadastrado ainda. Cadastre abaixo o Administrador Principal. **Não existe cadastro público de novos usuários por fora**.</p>
                    </div>

                    <form id="first-user-form" class="space-y-4" onsubmit="handleFirstUserSubmit(event)">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-1">Nome do Proprietário / Administrador *</label>
                            <input type="text" id="admin-name" required class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-brand-500 outline-none text-xs font-medium">

        window.saveCashMovement = async function(type) {
            const openSession = AppState.cashSessions.find(s => s.status === 'ABERTO');
            if (!openSession) return;

            const amount = parseFloat(document.getElementById('cash-mov-val').value) || 0;
            const description = document.getElementById('cash-mov-desc').value;

            if (amount <= 0 || !description) {
                showToast("Preencha o valor e motivo corretamente.", "error");
                return;
            }

            const mov = {
                id: crypto.randomUUID(),
                cashSessionId: openSession.id,
                type,
                category: type === 'ENTRADA' ? 'SUPRIMENTO' : 'SANGRIA',
                amount,
                description,
                userName: AppState.currentUser.name,
                date: new Date().toISOString()
            };

            await saveData('cashMovements', mov.id, mov);
            showToast(`${type} registrada no caixa!`, "success");
            closeModal();
            renderApp();
        };

        window.closeCashSessionModal = function() {
            const openSession = AppState.cashSessions.find(s => s.status === 'ABERTO');
            if (!openSession) return;

            const movements = AppState.cashMovements.filter(m => m.cashSessionId === openSession.id);
            const totalIn = movements.filter(m => m.type === 'ENTRADA').reduce((a, m) => a + m.amount, 0);
            const totalOut = movements.filter(m => m.type === 'SAIDA').reduce((a, m) => a + m.amount, 0);
            const expectedBalance = openSession.initialBalance + totalIn - totalOut;

            const body = `
                <div class="bg-slate-50 p-4 rounded-xl border border-slate-200 text-xs space-y-1">
                    <p class="flex justify-between"><span>Valor Inicial:</span> <strong>${formatMoney(openSession.initialBalance)}</strong></p>
                    <p class="flex justify-between"><span>Total de Entradas:</span> <strong class="text-emerald-600">+${formatMoney(totalIn)}</strong></p>
                    <p class="flex justify-between"><span>Total de Saídas:</span> <strong class="text-rose-600">-${formatMoney(totalOut)}</strong></p>
                    <p class="flex justify-between text-sm font-black pt-2 border-t border-slate-200"><span>Saldo Esperado em Gaveta:</span> <strong>${formatMoney(expectedBalance)}</strong></p>
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Valor Contado em Gaveta (R$) *</label>
                    <input type="number" step="0.01" id="cash-closing-val" value="${expectedBalance.toFixed(2)}" class="w-full px-3 py-2 border rounded-xl text-xs font-bold outline-none focus:ring-2 focus:ring-brand-500">
                </div>
            `;

            const buttons = `
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-xs font-bold rounded-xl">Cancelar</button>
                <button onclick="finishCashSession('${openSession.id}', ${expectedBalance})" class="px-4 py-2 bg-rose-600 text-white text-xs font-bold rounded-xl shadow">Confirmar Fechamento</button>
            `;

            showModal("Fechar Caixa de Vendas", body, buttons);
        };

        window.finishCashSession = async function(sessionId, expected) {
            const actual = parseFloat(document.getElementById('cash-closing-val').value) || 0;
            const diff = actual - expected;

            const session = AppState.cashSessions.find(s => s.id === sessionId);
            if (!session) return;

            await saveData('cashSessions', session.id, {
                ...session,
                closedAt: new Date().toISOString(),
                closedByName: AppState.currentUser.name,
                expectedBalance: expected,
                actualBalance: actual,
                difference: diff,
                status: 'FECHADO'
            });

            await logAudit('caixa_fechado', `Caixa fechado por ${AppState.currentUser.name}. Diferença: R$ ${diff}`);
            showToast("Caixa FECHADO com sucesso!", "success");
            closeModal();
            renderApp();
        };

            const supplierId = document.getElementById('se-supplier').value;
            const quantity = parseInt(document.getElementById('se-qty').value) || 0;

            };

                ...product,

                productName: product.name,
                type: 'entrada_nota',

                unit: product.unit,

                userName: AppState.currentUser.name,
                date: new Date().toISOString(),
                stockBefore: product.stockQuantity,
                stockAfter: newStock

        window.saveFiadoPayment = async function(accountId) {
            const acc = AppState.fiadoAccounts.find(a => a.id === accountId);
            const paymentVal = parseFloat(document.getElementById('fp-amount').value) || 0;

            if (paymentVal <= 0) {
                showToast("Informe um valor válido.", "error");
                return;
            }

            const newBalance = Math.max(0, acc.remainingBalance - paymentVal);
            const isPaid = newBalance === 0;

            await saveData('fiadoAccounts', acc.id, {
                ...acc,
                remainingBalance: newBalance,
                paidAmount: (acc.paidAmount || 0) + paymentVal,
                status: isPaid ? 'Pago' : 'Em aberto'
            });

            // Update Client overall debt
            const client = AppState.clients.find(c => c.id === acc.clientId);
            if (client) {
                await saveData('clients', client.id, {
                    ...client,
                    currentDebt: Math.max(0, (client.currentDebt || 0) - paymentVal)
                });
            }

            showToast("PAGAMENTO DE FIADO REGISTRADO!", "success");
            closeModal();
            renderApp();
        };

            const phone = document.getElementById('s-phone').value;
            if (!name) return;

            const supp = { id: crypto.randomUUID(), name, phone };
            await saveData('suppliers', supp.id, supp);
            showToast("Fornecedor cadastrado!", "success");
            closeModal();
            renderApp();
        };

        // --- 12. CALENDÁRIO COMERCIAL ---
        function renderCalendarView() {
            return `
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <h1 class="text-xl font-black text-slate-900">CALENDÁRIO DE VENCIMENTOS E EVENTOS</h1>
                        <p class="text-xs text-slate-500">Acompanhamento de vencimentos de fiados e entregas</p>
                    </div>
                </div>

                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h3 class="font-bold text-slate-800 text-sm">Próximos Eventos do Sistema</h3>
                    <div class="divide-y divide-slate-100 text-xs">
                        ${AppState.calendarEvents.length === 0 ? `
                            <p class="py-6 text-center text-slate-400">Nenhum evento registrado.</p>
                        ` : AppState.calendarEvents.map(e => `
                            <div class="py-3 flex justify-between items-center">
                                <div>
                                    <p class="font-bold text-slate-800">${e.title}</p>
                                    <p class="text-slate-400">${e.description}</p>
                                </div>
                                <span class="px-2.5 py-1 bg-brand-50 text-brand-700 font-bold rounded-lg">${formatDateOnly(e.date)}</span>
                            </div>
                        `).join('')}
                    </div>
                </div>
            </div>
            `;
        }

        // --- 13. RELATÓRIOS FINANCEIROS ---
        function renderReportsView() {
            const totalRevenue = AppState.sales.reduce((a, s) => a + s.total, 0);
            const totalSalesCount = AppState.sales.length;

            return `
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h1 class="text-xl font-black text-slate-900">RELATÓRIOS FINANCEIROS E BALANÇO</h1>
                    <p class="text-xs text-slate-500">Resumo acumulado de vendas e movimentação comercial</p>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-3 gap-5">
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                        <span class="text-xs font-bold text-slate-400 uppercase">Faturamento Total</span>
                        <p class="text-2xl font-black text-emerald-600">${formatMoney(totalRevenue)}</p>
                    </div>
                    <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-2">
                        <span class="text-xs font-bold text-slate-400 uppercase">Total de Vendas</span>
                        <p class="text-2xl font-black text-slate-900">${totalSalesCount}</p>
                    </div>
                </div>
            </div>
            `;
        }

        // --- 14. USUÁRIOS E PERMISSÕES (Segurança Estrita Interna) ---
        function renderUsersView() {
            return `
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
                <div class="flex flex-col md:flex-row md:items-center justify-between gap-4 bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <div>
                        <h1 class="text-xl font-black text-slate-900">GESTÃO DE USUÁRIOS E SEGURANÇA</h1>
                        <p class="text-xs text-slate-500">Cadastre funcionários internamente. **Acesso público de cadastro bloqueado**.</p>
                    </div>
                    <button onclick="openUserModal()" class="px-4 py-2.5 bg-brand-600 text-white font-bold text-xs rounded-xl shadow hover:bg-brand-700 transition flex items-center gap-2">
                        <i data-lucide="user-plus" class="w-4 h-4"></i>
                        Cadastrar Novo Funcionário
                    </button>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 font-bold text-slate-400 uppercase border-b border-slate-100">
                                    <th class="p-4">Nome</th>
                                    <th class="p-4">E-mail</th>
                                    <th class="p-4">Cargo / Função</th>
                                    <th class="p-4">Status</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${AppState.users.map(u => `
                                    <tr>
                                        <td class="p-4 font-bold text-slate-800">${u.name}</td>
                                        <td class="p-4 text-slate-600">${u.email}</td>
                                        <td class="p-4"><span class="px-2.5 py-1 bg-brand-50 text-brand-700 font-bold rounded-lg">${u.role}</span></td>
                                        <td class="p-4"><span class="px-2 py-0.5 ${u.active ? 'bg-emerald-50 text-emerald-700' : 'bg-rose-50 text-rose-700'} font-bold rounded">Ativo</span></td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        window.openUserModal = function() {
            const body = `
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome Completo *</label>
                    <input type="text" id="u-name" required class="w-full px-3 py-2 border rounded-xl text-xs font-bold">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">E-mail de Acesso *</label>
                    <input type="email" id="u-email" required class="w-full px-3 py-2 border rounded-xl text-xs font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Senha de Acesso *</label>
                    <input type="password" id="u-pass" minlength="6" required class="w-full px-3 py-2 border rounded-xl text-xs font-medium">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Cargo / Função *</label>
                    <select id="u-role" class="w-full px-3 py-2 border rounded-xl text-xs font-bold">
                        <option value="OPERADOR CAIXA">Operador de Caixa</option>
                        <option value="ESTOQUISTA">Estoquista</option>
                        <option value="GERENTE">Gerente de Loja</option>
                        <option value="ADMINISTRADOR">Administrador Geral</option>
                    </select>
                </div>
            `;

            const buttons = `
                <button onclick="closeModal()" class="px-4 py-2 bg-slate-100 text-xs font-bold rounded-xl">Cancelar</button>
                <button onclick="saveUser()" class="px-4 py-2 bg-brand-600 text-white text-xs font-bold rounded-xl shadow">Criar Usuário</button>
            `;

            showModal("Cadastrar Novo Funcionário", body, buttons);
        };

        window.saveUser = async function() {
            const name = document.getElementById('u-name').value;
            const email = document.getElementById('u-email').value;
            const password = document.getElementById('u-pass').value;
            const role = document.getElementById('u-role').value;

            if (!name || !email || !password) {
                showToast("Preencha todos os campos.", "error");
                return;
            }

            const newUser = {
                id: crypto.randomUUID(),
                name,
                email,
                password,
                role,
                active: true,
                createdAt: new Date().toISOString()
            };

            await saveData('users', newUser.id, newUser);
            await logAudit('usuario_criado', `Usuário ${name} cadastrado por ${AppState.currentUser.name}`);
            showToast("NOVO USUÁRIO CRIADO!", "success");
            closeModal();
            renderApp();
        };

        // --- 15. CONFIGURAÇÕES & AUDITORIA ---
        function renderSettingsView() {
            return `
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                    <h1 class="text-xl font-black text-slate-900">CONFIGURAÇÕES DA LOJA</h1>
                    <div class="space-y-3 max-w-md">
                        <div>
                            <label class="block text-xs font-bold text-slate-700 uppercase mb-1">Nome do Estabelecimento</label>
                            <input type="text" id="st-name" value="${AppState.settings.storeName}" class="w-full px-3 py-2 border rounded-xl text-xs font-bold">
                        </div>
                        <button onclick="saveSettings()" class="px-4 py-2 bg-brand-600 text-white font-bold text-xs rounded-xl shadow">Salvar Parâmetros</button>
                    </div>
                </div>
            </div>
            `;
        }

        window.saveSettings = async function() {
            const storeName = document.getElementById('st-name').value;
            AppState.settings.storeName = storeName;
            showToast("Configurações salvas!", "success");
            renderApp();
        };

        function renderAuditView() {
            return `
            <div class="p-8 space-y-6 max-w-7xl mx-auto w-full">
                <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                    <h1 class="text-xl font-black text-slate-900">AUDITORIA DE AÇÕES DO SISTEMA</h1>
                    <p class="text-xs text-slate-500">Histórico de movimentações e operações de usuários</p>
                </div>

                <div class="bg-white rounded-2xl border border-slate-200 shadow-sm overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 font-bold text-slate-400 uppercase border-b border-slate-100">
                                    <th class="p-4">Data/Hora</th>
                                    <th class="p-4">Usuário</th>
                                    <th class="p-4">Ação</th>
                                    <th class="p-4">Registro Afetado</th>
                                </tr>
                            </thead>
                            <tbody class="divide-y divide-slate-100">
                                ${AppState.auditLogs.map(l => `
                                    <tr>
                                        <td class="p-4 text-slate-500">${formatDate(l.timestamp)}</td>
                                        <td class="p-4 font-bold text-slate-800">${l.userName}</td>
                                        <td class="p-4"><span class="px-2 py-0.5 bg-slate-100 font-bold rounded">${l.action}</span></td>
                                        <td class="p-4 text-slate-600">${l.recordAffected}</td>
                                    </tr>
                                `).join('')}
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
            `;
        }

        // --- RENDER APP MAIN SWITCHER ---
        function renderApp() {
            const root = document.getElementById('app-root');
            
            if (AppState.users.length === 0) {
                root.innerHTML = renderFirstSetup();
            } else if (!AppState.currentUser) {
                root.innerHTML = renderLogin();
            } else {
                let content = '';
                switch (AppState.activeTab) {
                    case 'dashboard': content = renderDashboardView(); break;
                    case 'pos': content = renderPOSView(); break;
                    case 'cash': content = renderCashView(); break;
                    case 'products': content = renderProductsView(); break;
                    case 'stock_entries': content = renderStockEntriesView(); break;
                    case 'stock': content = renderStockView(); break;
                    case 'stock_alerts': content = renderStockAlertsView(); break;
                    case 'clients': content = renderClientsView(); break;
                    case 'fiado': content = renderFiadoView(); break;
                    case 'fiado_alerts': content = renderFiadoAlertsView(); break;
                    case 'suppliers': content = renderSuppliersView(); break;
                    case 'calendar': content = renderCalendarView(); break;
                    case 'reports': content = renderReportsView(); break;
                    case 'users': content = renderUsersView(); break;
                    case 'settings': content = renderSettingsView(); break;
                    case 'audit': content = renderAuditView(); break;
                    default: content = renderDashboardView();
                }

                root.innerHTML = `
                <div class="flex h-screen bg-slate-50 overflow-hidden">
                    ${renderSidebar()}
                    <main class="flex-1 overflow-y-auto flex flex-col">
                        ${content}
                    </main>
                </div>
                `;
            }

            lucide.createIcons();
        }

        window.onload = async function() {
            await initAuth();
            renderApp();
        };
    </script>
</body>
</html>
