
<!DOCTYPE html>
<html lang="pt-BR" class="h-full bg-slate-50">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EDUARDO BEBIDAS - Sistema Comercial Completo</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            50: '#f0f7ff',
                            100: '#e0effe',
                            500: '#0284c7',
                            600: '#026597',
                            700: '#0369a1',
                            800: '#075985',
                            900: '#0c4a6e',
                        }
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- Google Fonts Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Html5Qrcode Barcode Scanner -->
    <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        #qr-reader video { object-fit: cover !important; border-radius: 0.75rem; }
    .product-row-button { min-height: 36px; }
        @media (max-width: 640px) { #app-modal-content { padding: 1rem; } }
        </style>
</head>
<body class="h-full text-slate-800 antialiased bg-slate-50 flex flex-col">

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed top-5 right-5 z-50 flex flex-col gap-2 max-w-sm pointer-events-none"></div>

    <!-- Universal Modal Dialog System -->
    <div id="app-modal" class="fixed inset-0 z-40 hidden flex items-center justify-center p-4 bg-slate-900/60 backdrop-blur-sm transition-opacity">
        <div id="app-modal-content" class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-xl w-full p-6 space-y-4 transform transition-all scale-95 opacity-0 max-h-[90vh] overflow-y-auto">
            <div class="flex items-start justify-between border-b pb-3 border-slate-100">
                <h3 id="app-modal-title" class="text-lg font-bold text-slate-900"></h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-600 rounded-lg p-1">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div id="app-modal-body" class="text-slate-600 text-sm leading-relaxed space-y-3"></div>
            <div id="app-modal-footer" class="flex justify-end gap-3 pt-3 border-t border-slate-100"></div>
        </div>
    </div>

    <!-- Barcode Camera Scanner Modal -->
    <div id="scanner-modal" class="fixed inset-0 z-50 hidden flex items-center justify-center p-4 bg-slate-950/80 backdrop-blur-md">
        <div class="bg-white rounded-2xl shadow-2xl border border-slate-200 max-w-md w-full p-6 space-y-4">
            <div class="flex items-center justify-between border-b pb-3 border-slate-100">
                <div class="flex items-center gap-2">
                    <div class="p-2 bg-brand-50 text-brand-600 rounded-xl">
                        <i data-lucide="camera" class="w-5 h-5"></i>
                    </div>
                    <div>
                        <h3 class="font-bold text-slate-900 text-base">LEITOR CÂMERA EM TEMPO REAL</h3>
                        <p class="text-xs text-slate-500">Aponte para o código do produto</p>
                    </div>
                </div>
                <button onclick="stopCameraScanner()" class="text-slate-400 hover:text-slate-600 p-1 rounded-lg">
                    <i data-lucide="x" class="w-6 h-6"></i>
                </button>
            </div>

            <div class="space-y-3">
                <div id="scanner-status" class="bg-slate-100 rounded-xl p-3 text-xs text-slate-600 flex items-center justify-between">
                    <span id="scanner-status-text">Iniciando câmera...</span>
                    <span id="scanner-diagnostic" class="font-mono bg-white px-2 py-0.5 rounded border text-[11px] text-slate-700 hidden">CÓDIGO: -</span>
                </div>

                <div class="relative overflow-hidden rounded-xl bg-slate-900 aspect-square flex items-center justify-center border-2 border-brand-500/30">
                    <div id="qr-reader" class="w-full h-full"></div>
                    <div class="absolute inset-0 pointer-events-none border-2 border-brand-500/60 rounded-xl m-8 flex items-center justify-center">
                        <div class="w-full h-0.5 bg-red-500/80 animate-pulse"></div>
                    </div>
                </div>
            </div>

            <div class="flex justify-end gap-2 pt-2 border-t border-slate-100">
                <button onclick="stopCameraScanner()" class="px-4 py-2 bg-slate-100 text-slate-700 hover:bg-slate-200 text-xs font-bold rounded-xl transition">
                    Fechar
                </button>
            </div>
        </div>
    </div>

    <!-- Main View Root Container -->
    <div id="app-root" class="flex-1 flex flex-col min-h-screen"></div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const appId = typeof __app_id !== 'undefined' ? __app_id : 'eduardo-bebidas-prod';
        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
            apiKey: "demo-api-key",
            authDomain: "demo-project.firebaseapp.com",
            projectId: "demo-project",
            storageBucket: "demo-project.appspot.com",
            messagingSenderId: "123456789",
            appId: "1:123456789:web:123456789"
        };

        const firebaseApp = initializeApp(firebaseConfig);
        const auth = getAuth(firebaseApp);
        const db = getFirestore(firebaseApp);

        const AppState = {
            currentUser: null,
            activeTab: 'dashboard',
            scannerTargetAction: 'pos',
            html5QrcodeScanner: null,
            isScanning: false,
            lastScannedCode: null,
            lastScanTime: 0,
            usbBuffer: '',
            usbTimeout: null,
            
            users: [],
            products: [],
            categories: [],
            suppliers: [],
            stockEntries: [],
            stockMovements: [],
            clients: [],
            sales: [],
            fiadoAccounts: [],
            fiadoPayments: [],
            cashSessions: [],
            cashMovements: [],
            calendarEvents: [],
            auditLogs: [],
            settings: {
                storeName: 'EDUARDO BEBIDAS',
                phone: '(00) 00000-0000',
                address: 'Rua Principal, Centro',
                fiadoDefaultDays: 15,
                fiadoAlert1Days: 15,
                fiadoAlert2Days: 30,
                whatsappMessageTemplate: 'Olá {cliente}, você possui um débito no valor de {valor} vencido em {vencimento} na EDUARDO BEBIDAS. Podemos agendar o pagamento?'
            },

            posCart: [],
            posClient: null,
            posPaymentMethod: 'DINHEIRO',
            posDiscount: 0,
            
            filters: {
                productSearch: '',
                clientSearch: '',
                reportRange: '30',
                calendarDate: new Date().toISOString().slice(0,10)
            }
        };

        window.showToast = function(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bg = 'bg-slate-900 text-white';
            let icon = 'info';
            if (type === 'success') { bg = 'bg-emerald-600 text-white'; icon = 'check-circle'; }
            if (type === 'error') { bg = 'bg-rose-600 text-white'; icon = 'alert-triangle'; }
            if (type === 'warning') { bg = 'bg-amber-500 text-white'; icon = 'alert-circle'; }

            toast.className = `${bg} px-4 py-3 rounded-xl shadow-xl flex items-center gap-3 text-xs font-bold transition-all duration-300 pointer-events-auto transform translate-y-2 opacity-0`;
            toast.innerHTML = `<i data-lucide="${icon}" class="w-5 h-5 flex-shrink-0"></i><span>${message}</span>`;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => toast.classList.remove('translate-y-2', 'opacity-0'), 10);
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-2');
                setTimeout(() => toast.remove(), 300);
            }, 4000);
        };

        window.showModal = function(title, bodyHtml, footerButtonsHtml = '') {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            document.getElementById('app-modal-title').textContent = title;
            document.getElementById('app-modal-body').innerHTML = bodyHtml;
            document.getElementById('app-modal-footer').innerHTML = footerButtonsHtml;
            
            modal.classList.remove('hidden');
            setTimeout(() => content.classList.remove('scale-95', 'opacity-0'), 10);
            lucide.createIcons();
        };

        window.closeModal = function() {
            const modal = document.getElementById('app-modal');
            const content = document.getElementById('app-modal-content');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => modal.classList.add('hidden'), 200);
        };

        const formatMoney = (val) => new Intl.NumberFormat('pt-BR', { style: 'currency', currency: 'BRL' }).format(val || 0);
        const formatDate = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' });
        };
        const formatDateOnly = (dateStr) => {
            if (!dateStr) return '-';
            const d = new Date(dateStr);
            return isNaN(d) ? dateStr : d.toLocaleDateString('pt-BR', { day: '2-digit', month: '2-digit', year: 'numeric' });
        };

        const escapeHtml = (value) => String(value ?? '').replace(/[&<>\"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]));
        const toDateKey = (value) => { const d = new Date(value); return isNaN(d) ? '' : d.toISOString().slice(0,10); };
        const startOfDay = (key) => new Date(`${key}T00:00:00`);
        const addDays = (key, days) => { const d = startOfDay(key); d.setDate(d.getDate()+days); return d.toISOString().slice(0,10); };
        const getSaleItemsSummary = (sale) => (sale.items || []).map(i => `${i.quantity}x ${i.name} (${i.unitLabel || 'un.'})`).join(' • ');
        const getClientDebt = (clientId) => AppState.fiadoAccounts.filter(a => a.clientId === clientId && (a.remainingBalance || 0) > 0).reduce((sum,a) => sum + Number(a.remainingBalance || 0), 0);
        const isSaleToday = (sale) => toDateKey(sale.date) === toDateKey(new Date());

        async function syncSettings() {
            try {
                const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'settings', 'global');
                onSnapshot(settingsRef, (snap) => {
                    if (snap.exists()) {
                        AppState.settings = { ...AppState.settings, ...snap.data() };
                        renderApp();
                    }
                }, (err) => console.error('Sync error settings:', err));
            } catch (e) {
                console.error('Error syncing settings', e);
            }
        }

        async function syncCollection(colName, stateProp) {
            try {
                const q = collection(db, 'artifacts', appId, 'public', 'data', colName);
                onSnapshot(q, (snapshot) => {
                    const items = [];
                    snapshot.forEach(docSnap => items.push({ id: docSnap.id, ...docSnap.data() }));
                    AppState[stateProp] = items;
                    renderApp();
                }, (err) => console.error(`Sync error ${colName}:`, err));
            } catch (e) {
                console.error(`Error syncing ${colName}`, e);
            }
        }

        async function saveData(colName, id, data) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, id);
                await setDoc(docRef, { ...data, updatedAt: new Date().toISOString() }, { merge: true });
                return true;
            } catch (e) {
                console.error(`Save error ${colName}:`, e);
                showToast("Erro ao salvar dados no servidor.", "error");
                return false;
            }
        }

        async function deleteData(colName, id) {
            try {
                const docRef = doc(db, 'artifacts', appId, 'public', 'data', colName, id);
                await deleteDoc(docRef);
                return true;
            } catch (e) {
                console.error(`Delete error ${colName}:`, e);
                showToast("Erro ao excluir do servidor.", "error");
                return false;
            }
        }

        async function logAudit(action, recordAffected, oldValue = null, newValue = null, reason = '') {
            const audit = {
                id: crypto.randomUUID(),
                userName: AppState.currentUser ? AppState.currentUser.name : 'Sistema/Visitante',
                userRole: AppState.currentUser ? AppState.currentUser.role : 'ADMINISTRADOR',
                action,
                recordAffected,
                oldValue,
                newValue,
                reason,
                timestamp: new Date().toISOString()
            };
            await saveData('auditLogs', audit.id, audit);
        }

        async function initAuth() {
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
                    await signInWithCustomToken(auth, __initial_auth_token);
                } else {
                    await signInAnonymously(auth);
                }
            } catch (e) {
                console.warn("Auth fallback:", e);
            }

            await Promise.all([
                syncCollection('users', 'users'),
                syncCollection('products', 'products'),
                syncCollection('categories', 'categories'),
                syncCollection('suppliers', 'suppliers'),
                syncCollection('stockEntries', 'stockEntries'),
                syncCollection('stockMovements', 'stockMovements'),
                syncCollection('clients', 'clients'),
                syncCollection('sales', 'sales'),
                syncCollection('fiadoAccounts', 'fiadoAccounts'),
                syncCollection('fiadoPayments', 'fiadoPayments'),
                syncCollection('cashSessions', 'cashSessions'),
                syncCollection('cashMovements', 'cashMovements'),
                syncCollection('calendarEvents', 'calendarEvents'),
                syncCollection('auditLogs', 'auditLogs'),
                syncSettings(),
            ]);
        }

        window.startCameraScanner = function(targetAction = 'pos') {
            AppState.scannerTargetAction = targetAction;
            const modal = document.getElementById('scanner-modal');
            const statusText = document.getElementById('scanner-status-text');
            const diagText = document.getElementById('scanner-diagnostic');
            
            modal.classList.remove('hidden');
            diagText.classList.remove('hidden');
            statusText.textContent = "Acessando câmera...";

            AppState.html5QrcodeScanner = new Html5Qrcode("qr-reader");
            AppState.isScanning = true;

            AppState.html5QrcodeScanner.start(
                { facingMode: "environment" },
                { fps: 10, qrbox: { width: 250, height: 250 } },
                (decodedText) => {
                    diagText.textContent = `CÓDIGO: ${decodedText}`;
                    statusText.textContent = "LIDO!";
                    window.processBarcodeResult(decodedText);
                },
                () => {}
            ).catch(err => {
                statusText.textContent = "CÂMERA NÃO PERMITIDA";
                showToast("Não foi possível acessar a câmera.", "error");
            });
        };

        window.stopCameraScanner = function() {
            if (AppState.html5QrcodeScanner && AppState.isScanning) {
                AppState.html5QrcodeScanner.stop().then(() => {
                    AppState.isScanning = false;
                    document.getElementById('scanner-modal').classList.add('hidden');
                }).catch(() => {
                    document.getElementById('scanner-modal').classList.add('hidden');
                    AppState.isScanning = false;
                });
            } else {
                document.getElementById('scanner-modal').classList.add('hidden');
            }
        };

        window.processBarcodeResult = function(code) {
            if (!code) return;
            const now = Date.now();
            if (AppState.lastScannedCode === code && (now - AppState.lastScanTime) < 1500) return;
            AppState.lastScannedCode = code;
            AppState.lastScanTime = now;

            const codeClean = code.trim();
            const product = AppState.products.find(p => p.barcode === codeClean);

            if (product) {
                showToast(`PRODUTO: ${product.name}`, "success");
                if (AppState.scannerTargetAction === 'pos') {
                    window.addToPosCart(product.id);
                } else if (AppState.scannerTargetAction === 'stock_entry') {
                    window.openStockEntryModal(product.id);
                }
            } else {
                showToast(`CÓDIGO NÃO CADASTRADO (${code})`, "warning");
                if (AppState.currentUser?.permissions?.canManageProducts) {
                    window.openProductModal(null, codeClean);
                }
            }
            if (AppState.isScanning) window.stopCameraScanner();
        };

        window.addEventListener('keydown', (e) => {
            if (['INPUT', 'TEXTAREA', 'SELECT'].includes(e.target.tagName)) return;
            if (e.key === 'Enter') {
                if (AppState.usbBuffer.length >= 3) window.processBarcodeResult(AppState.usbBuffer);
                AppState.usbBuffer = '';
            } else if (e.key.length === 1) {
                AppState.usbBuffer += e.key;
                clearTimeout(AppState.usbTimeout);
                AppState.usbTimeout = setTimeout(() => AppState.usbBuffer = '', 100);
            }
        });

        window.addToPosCart = function(productId, conversionId = 'base', qty = 1) {
            const product = AppState.products.find(p => p.id === productId);
            if (!product) return;

            let unitLabel = product.unit;
            let multiplier = 1;
            let unitPrice = product.sellPrice;

            if (conversionId !== 'base') {
                const conv = (product.conversions || []).find(c => c.id === conversionId);
                if (!conv) {
                    showToast("CONVERSÃO NÃO CONFIGURADA: Este produto não possui esta conversão ativa.", "error");
                    return;
                }
                unitLabel = conv.name;
                multiplier = Number(conv.quantityInBase) || 1;
                unitPrice = Number(conv.sellPrice) || (product.sellPrice * multiplier);
            }

            const totalStockNeeded = qty * multiplier;
            const currentCartStockReserved = AppState.posCart
                .filter(i => i.productId === productId)
                .reduce((acc, i) => acc + i.baseQuantity, 0);

            if (product.stockQuantity < (currentCartStockReserved + totalStockNeeded)) {
                showToast(`ESTOQUE INSUFICIENTE: Disponível ${product.stockQuantity} ${product.unit}`, "error");
                return;
            }

            const cartItemId = `${productId}-${conversionId}`;
            const existingIndex = AppState.posCart.findIndex(i => i.id === cartItemId);

            if (existingIndex >= 0) {
                AppState.posCart[existingIndex].quantity += qty;
                AppState.posCart[existingIndex].baseQuantity = AppState.posCart[existingIndex].quantity * multiplier;
                AppState.posCart[existingIndex].subtotal = AppState.posCart[existingIndex].quantity * AppState.posCart[existingIndex].unitPrice;
            } else {
                AppState.posCart.push({
                    id: cartItemId,
                    productId: product.id,
                    name: product.name,
                    conversionId,
                    unitLabel,
                    multiplier,
                    unitPrice,
                    quantity: qty,
                    baseQuantity: totalStockNeeded,
                    subtotal: unitPrice * qty
                });
            }
            renderApp();
        };

        window.updateCartItemQty = function(cartItemId, newQty) {
            const item = AppState.posCart.find(i => i.id === cartItemId);
            if (!item) return;
            const product = AppState.products.find(p => p.id === item.productId);

            if (newQty <= 0) {
                AppState.posCart = AppState.posCart.filter(i => i.id !== cartItemId);
            } else {
                const totalStockNeeded = newQty * item.multiplier;
                if (product && product.stockQuantity < totalStockNeeded) {
                    showToast(`ESTOQUE INSUFICIENTE: Disponível ${product.stockQuantity} ${product.unit}`, "error");
                    return;
                }
                item.quantity = newQty;
                item.baseQuantity = totalStockNeeded;
                item.subtotal = item.quantity * item.unitPrice;
            }
            renderApp();
        };

        window.removeFromCart = function(cartItemId) {
            AppState.posCart = AppState.posCart.filter(i => i.id !== cartItemId);
            renderApp();
        };

        window.finalizeSale = async function() {
            if (AppState.posCart.length === 0) {
                showToast("O carrinho está vazio!", "warning");
                return;
            }

            const openSession = AppState.cashSessions.find(s => s.status === 'ABERTO');
            if (!openSession) {
                showToast("ABRA O CAIXA antes de finalizar vendas!", "error");
                window.switchTab('cash');
                return;
            }

            const subtotal = AppState.posCart.reduce((sum, item) => sum + item.subtotal, 0);
            const total = Math.max(0, subtotal - AppState.posDiscount);

            if (AppState.posPaymentMethod === 'FIADO') {
                if (!AppState.posClient) {
                    showToast("Selecione um Cliente Fiado!", "warning");
                    return;
                }
                const client = AppState.clients.find(c => c.id === AppState.posClient);
                if (!client) {
                    showToast("Cliente não encontrado.", "error");
                    return;
                }
                const currentDebt = client.currentDebt || 0;
                if ((currentDebt + total) > (client.creditLimit || 0)) {
                    showToast(`LIMITE INSUFICIENTE! Crédito Restante: ${formatMoney((client.creditLimit||0) - currentDebt)}`, "error");
                    return;
                }
            }

            const saleId = crypto.randomUUID();
            const sale = {
                id: saleId,
                code: `VND-${Date.now().toString().slice(-6)}`,
                date: new Date().toISOString(),
                sellerName: AppState.currentUser.name,
                sellerId: AppState.currentUser.id,
                cashSessionId: openSession.id,
                items: AppState.posCart,
                subtotal,
                discount: AppState.posDiscount,
                total,
                paymentMethod: AppState.posPaymentMethod,
                clientId: AppState.posClient || null,
                status: 'APROVADA'
            };

            for (const item of AppState.posCart) {
                const prod = AppState.products.find(p => p.id === item.productId);
                if (prod) {
                    const newStock = prod.stockQuantity - item.baseQuantity;
                    await saveData('products', prod.id, { ...prod, stockQuantity: newStock });
                    
                    const move = {
                        id: crypto.randomUUID(),
                        productId: prod.id,
                        productName: prod.name,
                        type: 'venda',
                        quantity: -item.baseQuantity,
                        unit: prod.unit,
                        reason: `Venda ${sale.code} (${item.quantity}x ${item.unitLabel})`,
                        userName: AppState.currentUser.name,
                        date: new Date().toISOString(),
                        stockBefore: prod.stockQuantity,
                        stockAfter: newStock
                    };
                    await saveData('stockMovements', move.id, move);
                }
            }

            if (AppState.posPaymentMethod === 'FIADO') {
                const client = AppState.clients.find(c => c.id === AppState.posClient);
                const dueDate = new Date();
                dueDate.setDate(dueDate.getDate() + (AppState.settings.fiadoDefaultDays || 15));

                const fiadoAcc = {
                    id: crypto.randomUUID(),
                    clientId: client.id,
                    clientName: client.name,
                    saleId: sale.id,
                    saleCode: sale.code,
                    createdAt: new Date().toISOString(),
                    dueDate: dueDate.toISOString(),
                    originalAmount: total,
                    paidAmount: 0,
                    remainingBalance: total,
                    status: 'Em aberto'
                };

                await saveData('fiadoAccounts', fiadoAcc.id, fiadoAcc);
                await saveData('clients', client.id, {
                    ...client,
                    currentDebt: (client.currentDebt || 0) + total
                });

                const purchaseKey = toDateKey(sale.date);
                const alert15 = { id: crypto.randomUUID(), title: `Cobrança Fiado - 15 dias: ${client.name}`, date: addDays(purchaseKey, 15), type: 'fiado_alert_15', description: `Venda ${sale.code} - saldo inicial ${formatMoney(total)}` };
                const alert30 = { id: crypto.randomUUID(), title: `Cobrança Fiado - 30 dias: ${client.name}`, date: addDays(purchaseKey, 30), type: 'fiado_alert_30', description: `Venda ${sale.code} - verificar pagamento` };

                await Promise.all([saveData('calendarEvents', alert15.id, alert15), saveData('calendarEvents', alert30.id, alert30), saveData('calendarEvents', dueEvent.id, dueEvent)]);
            }

            if (AppState.posPaymentMethod === 'DINHEIRO' || AppState.posPaymentMethod === 'PIX' || AppState.posPaymentMethod === 'CARTÃO') {

                    id: crypto.randomUUID(),
                    cashSessionId: openSession.id,

                    description: `Venda ${sale.code} (${AppState.posPaymentMethod})`,
                    userName: AppState.currentUser.name,
                    date: new Date().toISOString()
                };
                await saveData('cashMovements', cashMov.id, cashMov);
            }

            await saveData('sales', sale.id, sale);
            await logAudit('venda_aprovada', `Venda ${sale.code}`, null, sale);

            showToast(`VENDA ${sale.code} FINALIZADA COM SUCESSO!`, "success");

        window.saveProductSubmit = async function(e, productId) {
            e.preventDefault();
            const name = document.getElementById('p-name').value;
            const barcode = document.getElementById('p-barcode').value;
            const unit = document.getElementById('p-unit').value;
            const buyPrice = Number(document.getElementById('p-buy').value) || 0;
            const sellPrice = Number(document.getElementById('p-sell').value) || 0;
            const stockQuantity = Number(document.getElementById('p-stock').value) || 0;
            const minStock = Number(document.getElementById('p-min').value) || 5;

            const conversions = [];
            document.querySelectorAll('.conversion-row').forEach(row => {
                const cName = row.querySelector('.c-name').value;
                const cQty = Number(row.querySelector('.c-qty').value) || 0;
                const cPrice = Number(row.querySelector('.c-price').value) || 0;
                if (cName && cQty > 0) {
                    conversions.push({
                        id: crypto.randomUUID(),
                        name: cName,
                        quantityInBase: cQty,
                        sellPrice: cPrice
                    });
                }
            });

            const id = productId || crypto.randomUUID();
            const product = {
                id,
                name,
                barcode,
                unit,
                buyPrice,
                sellPrice,
                stockQuantity,
                minStock,
                conversions
            };

            await saveData('products', id, product);
            await logAudit('salvar_produto', `Produto ${name}`, null, product);
            showToast("Produto salvo com sucesso!", "success");
            closeModal();
        };

            await deleteData('products', id);
            showToast("Produto excluído.", "success");
        };

        window.updateStockEntryUnitOptions = function(productId) {
            const product = AppState.products.find(p => p.id === productId);
            const select = document.getElementById('se-conversion');
            if (!product || !select) return;

            let html = `<option value="base">Unidade Base (${product.unit})</option>`;
            if (product.conversions && product.conversions.length > 0) {
                product.conversions.forEach(c => {
                    html += `<option value="${c.id}">${c.name} (= ${c.quantityInBase} ${product.unit})</option>`;
                });
            }
            select.innerHTML = html;

        window.saveStockEntrySubmit = async function(e) {
            e.preventDefault();
            const productId = document.getElementById('se-product').value;
            const inputQty = Number(document.getElementById('se-qty').value) || 0;
            const conversionId = document.getElementById('se-conversion').value;
            const invoiceNumber = document.getElementById('se-invoice').value.trim();
            if (!invoiceNumber) { showToast('Informe o número da nota fiscal.', 'warning'); return; }

            const product = AppState.products.find(p => p.id === productId);
            if (!product) return;

            let convertedBaseQuantity = inputQty;
            let inputUnitName = product.unit;

            if (conversionId !== 'base') {
                const conv = (product.conversions || []).find(c => c.id === conversionId);
                if (conv) {
                    convertedBaseQuantity = inputQty * conv.quantityInBase;
                    inputUnitName = conv.name;
                }
            }

            const newStock = product.stockQuantity + convertedBaseQuantity;
            await saveData('products', product.id, { ...product, stockQuantity: newStock });

            const entryId = crypto.randomUUID();
            const entry = {
                id: entryId,
                productId: product.id,
                productName: product.name,
                inputQuantity: inputQty,
                inputUnitName,
                conversionId,
                convertedBaseQuantity,
                invoiceNumber,
                userName: AppState.currentUser.name,
                date: new Date().toISOString()
            };

            await saveData('stockEntries', entryId, entry);

            const move = {
                id: crypto.randomUUID(),
                productId: product.id,
                productName: product.name,
                type: 'entrada',
                quantity: convertedBaseQuantity,
                unit: product.unit,
                reason: `Entrada NF ${invoiceNumber || '-'} (${inputQty} ${inputUnitName})`,
                userName: AppState.currentUser.name,
                date: new Date().toISOString(),
                stockBefore: product.stockQuantity,
                stockAfter: newStock
            };
            await saveData('stockMovements', move.id, move);

            await logAudit('entrada_estoque', `Entrada de ${convertedBaseQuantity} ${product.unit} em ${product.name}`, null, entry);
            showToast("Entrada registrada e estoque atualizado com sucesso!", "success");
            closeModal();
        };

        window.closeCashSubmit = async function(e, sessionId) {
            e.preventDefault();
            const counted = Number(document.getElementById('cc-counted').value) || 0;
            const session = AppState.cashSessions.find(s => s.id === sessionId);
            if (!session) return;

            const sessionMovements = AppState.cashMovements.filter(m => m.cashSessionId === sessionId);
            const totalIn = sessionMovements.filter(m => m.type === 'ENTRADA').reduce((a, b) => a + b.amount, 0);
            const totalOut = sessionMovements.filter(m => m.type === 'SAIDA').reduce((a, b) => a + b.amount, 0);
            const expected = session.initialBalance + totalIn - totalOut;
            const diff = counted - expected;

            const closedData = {
                ...session,
                closedAt: new Date().toISOString(),
                closedBy: AppState.currentUser.name,
                expectedBalance: expected,
                countedBalance: counted,
                difference: diff,
                status: 'FECHADO'
            };

            await saveData('cashSessions', sessionId, closedData);
            await logAudit('fechamento_caixa', `Caixa fechado. Esperado: ${formatMoney(expected)}, Contado: ${formatMoney(counted)}`, session, closedData);
            showToast(`Caixa fechado. Diferença: ${formatMoney(diff)}`, "success");
            closeModal();
        };

        window.saveFiadoPaymentSubmit = async function(e, accountId) {
            e.preventDefault();
            const payAmount = Number(document.getElementById('fp-amount').value) || 0;
            const acc = AppState.fiadoAccounts.find(a => a.id === accountId);
            if (!acc) return;

            const newRemaining = Math.max(0, acc.remainingBalance - payAmount);
            const updatedAcc = {
                ...acc,
                paidAmount: (acc.paidAmount || 0) + payAmount,
                remainingBalance: newRemaining,
                status: newRemaining === 0 ? 'Quitado' : 'Parcial'
            };

            await saveData('fiadoAccounts', accountId, updatedAcc);

            const client = AppState.clients.find(c => c.id === acc.clientId);
            if (client) {
                await saveData('clients', client.id, {
                    ...client,
                    currentDebt: Math.max(0, (client.currentDebt || 0) - payAmount)
                });
            }

            const openSession = AppState.cashSessions.find(s => s.status === 'ABERTO');
            if (openSession) {
                const cashMov = {
                    id: crypto.randomUUID(),
                    cashSessionId: openSession.id,
                    type: 'ENTRADA',
                    category: 'RECEBIMENTO_FIADO',
                    amount: payAmount,
                    description: `Recebimento Fiado - ${acc.clientName}`,
                    userName: AppState.currentUser.name,
                    date: new Date().toISOString()
                };
                await saveData('cashMovements', cashMov.id, cashMov);
            }

            await logAudit('pagamento_fiado', `Recebido ${formatMoney(payAmount)} de ${acc.clientName}`, acc, updatedAcc);
            showToast("Pagamento registrado com sucesso!", "success");
            closeModal();
        };

            const daySales=AppState.sales.filter(s=>toDateKey(s.date)===selected); const dayRevenue=daySales.reduce((n,s)=>n+Number(s.total||0),0); const dayItems=daySales.reduce((n,s)=>n+(s.items||[]).reduce((x,i)=>x+Number(i.quantity||0),0),0); const dayEvents=AppState.calendarEvents.filter(e=>toDateKey(e.date)===selected);

6"><div class="bg-white rounded-2xl border shadow-sm overflow-hidden"><div class="p-5 border-b"><h2 class="font-black">PRODUTOS MAIS VENDIDOS</h2><p class="text-[10px] text-slate-400 mt-1">Quantidade de unidades/formas vendidas.</p></div>${top.map(([name,qty],i)=>`<div class="p-4 border-b last:border-0 flex items-center gap-3"><span class="w-7 h-7 rounded-lg bg-brand-50 text-brand-700 flex items-center justify-center text-[10px] font-black">${i+1}</span><span class="text-xs font-bold flex-1">${escapeHtml(name)}</span><strong class="text-xs">${qty}</strong></div>`).join('')||`<div class="p-8 text-center text-xs text-slate-400">Sem vendas no período.</div>`}</div><div class="bg-white rounded-2xl border shadow-sm p-5"><h2 class="font-black">DESTAQUE DO PERÍODO</h2><div class="mt-4 p-5 bg-brand-50 rounded-2xl border border-brand-100"><p class="text-[10px] uppercase font-black text-brand-600">Maior faturamento em um dia</p><p class="text-2xl font-black text-brand-900 mt-1">${bestDay?formatMoney(bestDay[1]):formatMoney(0)}</p><p class="text-xs text-brand-700 mt-1">${bestDay?formatDateOnly(bestDay[0]):'Nenhum registro'}</p></div><div class="mt-4 space-y-2 text-xs"><div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span>Vendas aprovadas</span><strong>${sales.length}</strong></div><div class="flex justify-between p-3 bg-slate-50 rounded-xl"><span>Clientes com fiado aberto</span><strong>${new Set(AppState.fiadoAccounts.filter(a=>a.remainingBalance>0).map(a=>a.clientId)).size}</strong></div></div></div></div></div>`;
